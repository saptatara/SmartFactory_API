version: "3.9"

services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heat_exchanger_db}
      POSTGRES_USER: ${POSTGRES_USER:-heatuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heatpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"

  web:
    build:
      context: .
    restart: on-failure
    volumes:
      - .:/app  # mount local repo into container
    ports:
      - "${HTTP_PORT:-8000}:8000"   # dynamic external port for each tenant
    depends_on:
      - db
    env_file:
      - .env                         # ensures we always use tenant-specific .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DJANGO_SETTINGS_MODULE: iot_platform.settings
    command: >
      sh -c "
        python manage.py collectstatic --noinput || true &&
        gunicorn iot_platform.wsgi:application --bind 0.0.0.0:8000
      "

volumes:
  pgdata:

